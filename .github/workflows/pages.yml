name: Build & deploy Qirtas site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pipeline deps
        working-directory: qirtas
        run: npm ci
      - name: Build static site
        working-directory: qirtas
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node site/tools/build.js
      - name: Smoke test
        working-directory: qirtas
        run: node tools/smoke-test.js --sample=4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qirtas/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
