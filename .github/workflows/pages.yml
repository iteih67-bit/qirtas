name: Build & deploy Qirtas site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install pipeline deps
        working-directory: qirtas
        run: npm ci --no-audit --no-fund
      - name: Build search index
        working-directory: qirtas
        run: node --no-warnings pipeline/build-index.js
      - name: Build static site
        working-directory: qirtas
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node --no-warnings site/tools/build.js
      - name: Build EPUB downloads
        working-directory: qirtas
        run: node --no-warnings site/tools/build-epub.js
      - name: Integrity check
        working-directory: qirtas
        run: |
          node --no-warnings tools/integrity-check.js || {
            echo '--- integrity report ---'
            cat cache/integrity-report.json 2>/dev/null | head -c 4000
            exit 1
          }
      - name: Smoke test
        working-directory: qirtas
        run: node tools/smoke-test.js --sample=4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qirtas/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
